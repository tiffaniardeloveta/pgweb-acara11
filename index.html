
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebGIS Administrasi Kecamatan</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Header Website */
        header {
            height: 50px;
            background-color: #1f4e79;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Tampilan Peta */
        #map {
            width: 100%;
            height: calc(100vh - 50px);
        }

        /* Legenda Peta */
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            line-height: 22px;
            font-size: 12px;
        }

        .legend h4 {
            margin: 0 0 7px;
            font-size: 13px;
            color: #1f4e79;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        /* Simbol Polygon */
        .polygon-symbol {
            width: 18px;
            height: 13px;
            background: rgba(46, 117, 182, 0.35);
            border: 2px solid #1f4e79;
            margin-right: 8px;
        }

        /* Simbol Line */
        .line-symbol {
            width: 20px;
            height: 0;
            border-top: 3px solid #e53935;
            margin-right: 8px;
        }

        /* Simbol Geoportal */
        .geoportal-symbol {
            width: 18px;
            height: 13px;
            background: rgba(255, 193, 7, 0.35);
            border: 2px solid #ff9800;
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <!-- Judul Website -->
    <header>
        WebGIS Administrasi Kecamatan
    </header>

    <!-- Area Peta -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Plugin Esri Leaflet -->
    <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>

    <script>

        // 1. Membuat peta
        var map = L.map('map').setView([-6.18, 106.83], 13);


        // 2. Basemap OpenStreetMap
        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        );


        // 3. Basemap Esri Satellite
        var esri = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri'
            }
        );


        // Menampilkan OpenStreetMap sebagai basemap awal
        osm.addTo(map);


        // 4. Koneksi GeoServer
        var geoserverURL =
            'http://localhost:8080/geoserver/pgweb/wms';


        // 5. Layer Polygon Administrasi Kecamatan
        var kecamatan = L.tileLayer.wms(
            geoserverURL,
            {
                layers: 'pgweb:ADMINISTRASIKECAMATAN_AR_25K',
                format: 'image/png',
                transparent: true,
                version: '1.1.0'
            }
        ).addTo(map);


        // 6. Layer Garis Administrasi
        var administrasi = L.tileLayer.wms(
            geoserverURL,
            {
                layers: 'pgweb:ADMINISTRASI_LN_25K',
                format: 'image/png',
                transparent: true,
                version: '1.1.0'
            }
        ).addTo(map);


        // 7. Layer Batas Administrasi Kecamatan Jakarta Pusat dari Geoportal
        var geoportalURL =
            'https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Batas_Administrasi_Kecamatan_Jakarta/FeatureServer/0';

        var geoportal = L.esri.featureLayer({
            url: geoportalURL,

            // Menampilkan data khusus Jakarta Pusat
            where: "wadmkk LIKE '%JAKARTA PUSAT%'",

            style: function (feature) {
                return {
                    color: '#ff9800',
                    weight: 2,
                    fillColor: '#ffc107',
                    fillOpacity: 0.35
                };
            },

            // Menampilkan informasi kecamatan ketika diklik
            onEachFeature: function (feature, layer) {

                var namaKecamatan =
                    feature.properties.wadmkc ||
                    feature.properties.WADMKC ||
                    'Tidak tersedia';

                var namaKota =
                    feature.properties.wadmkk ||
                    feature.properties.WADMKK ||
                    'Tidak tersedia';

                layer.bindPopup(
                    '<b>Nama Kecamatan:</b> ' + namaKecamatan +
                    '<br><b>Kota Administrasi:</b> ' + namaKota
                );
            }

        }).addTo(map);


        // 8. Kontrol Basemap
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri Satellite": esri
        };


        // 9. Kontrol Overlay
        var overlayMaps = {
            "Administrasi Kecamatan (Polygon)": kecamatan,
            "Administrasi (Line)": administrasi,
            "Batas Kecamatan Jakarta Pusat (Geoportal)": geoportal
        };


        L.control.layers(
            baseMaps,
            overlayMaps,
            {
                collapsed: false
            }
        ).addTo(map);


        // 10. Legenda Peta
        var legend = L.control({
            position: 'bottomleft'
        });

        legend.onAdd = function (map) {

            var div = L.DomUtil.create('div', 'legend');

            div.innerHTML = `
                <h4>Legenda</h4>

                <div class="legend-item">
                    <span class="polygon-symbol"></span>
                    Administrasi Kecamatan
                </div>

                <div class="legend-item">
                    <span class="line-symbol"></span>
                    Garis Administrasi
                </div>

                <div class="legend-item">
                    <span class="geoportal-symbol"></span>
                    Kecamatan Jakarta Pusat (Geoportal)
                </div>
            `;

            return div;
        };

        legend.addTo(map);


        // 11. Mengatur batas tampilan peta
        map.fitBounds([
            [-6.229305, 106.791862],
            [-6.135322, 106.881125]
        ]);

    </script>

</body>
</html>
